[project]
name = "stockpilot-backend"
version = "0.2.0"
description = "StockPilot inventory, purchasing, sales and demand-planning API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "email-validator>=2.0,<3.0",
  "python-dotenv>=1.0,<2.0",
  "bcrypt>=4.0,<6.0",
  "pyjwt>=2.8,<3.0",
  "alembic>=1.13,<2.0",
  "pymongo>=4.8,<5.0",
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
